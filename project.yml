name: Hearthstock
options:
  bundleIdPrefix: dev.0xhampton
  deploymentTarget:
    iOS: "18.0"
packages:
  HearthstockKit:
    path: Packages/HearthstockKit
targets:
  Hearthstock:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - App
      # The Slice 1 fixture, read in place so there's one copy. Only the DEBUG "Load sample pantry"
      # button uses it; Release builds leave it out.
      - path: Packages/HearthstockKit/Tests/HearthstockCoreTests/Fixtures/sample-pantry.json
        buildPhase: resources
    # Automatic signing; the team ID comes from the gitignored Config/Local.xcconfig, if present.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: HearthstockKit
        product: HearthstockCore
      - package: HearthstockKit
        product: HearthstockStore
      - package: HearthstockKit
        product: HearthstockLookup
    # Generated by xcodegen (gitignored); merged with the INFOPLIST_KEY_ settings below. Only for keys Xcode has no
    # INFOPLIST_KEY_ setting for.
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The Open Food Facts User-Agent contact (Slice 4 Decision 9): "Hearthstock/<version> (<contact>)".
        OFFContact: $(OFF_CONTACT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.0xhampton.hearthstock
        PRODUCT_NAME: Hearthstock
        INFOPLIST_KEY_CFBundleDisplayName: Hearthstock
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        EXCLUDED_SOURCE_FILE_NAMES[config=Release]: sample-pantry.json
        MARKETING_VERSION: "0.1.0"
        OFF_CONTACT: hampton.j.black@gmail.com
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan barcodes and expiry dates
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
