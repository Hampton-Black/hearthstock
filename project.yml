name: Hearthstock
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  HearthstockKit:
    path: Packages/HearthstockKit
targets:
  Hearthstock:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - App
    dependencies:
      - package: HearthstockKit
        product: HearthstockCore
      - package: HearthstockKit
        product: HearthstockStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hearthstock
        PRODUCT_NAME: Hearthstock
        INFOPLIST_KEY_CFBundleDisplayName: Hearthstock
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan barcodes and expiry dates
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
