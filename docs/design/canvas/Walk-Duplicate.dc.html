<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pantry walk, same item scanned again</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.cam{--ink:#F6EFE4;--ink2:#CFC3B2;--tint:#86BBA6;--card:#FFFDF9;--dk:#2B241E;--dk2:#5F554B;--track:#ECE5DA;--deep:#2F5D50;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:rgba(40,34,27,.78);font-size:15px;font-weight:600}
.corner{position:absolute;width:30px;height:30px;border-color:var(--ink);border-style:solid;border-width:0}
</style>
</helmet>
<div class="cam" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1C1813">
<div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(120% 60% at 50% 30%, #3A3128 0%, #1C1813 70%)"></div>

<div style="position: absolute; top: 58px; left: 16px; right: 16px; display: flex; align-items: center; justify-content: space-between">
<span class="pill"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Garage shelf</span>
<a href="Walk-Summary.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 16px; border-radius: 22px; background: var(--ink); color: var(--dk); font-size: 17px; font-weight: 600">Done</a>
</div>
<div style="position: absolute; left: 0; right: 0; top: 116px; display: flex; justify-content: center">
<span class="pill num" style="background: var(--deep); color: #FFFDF9"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{count}} added this walk</span>
</div>

<div aria-hidden="true" style="position: absolute; left: 70px; top: 190px; width: 250px; height: 150px">
<span class="corner" style="left: 0; top: 0; border-left-width: 4px; border-top-width: 4px; border-top-left-radius: 16px"></span>
<span class="corner" style="right: 0; top: 0; border-right-width: 4px; border-top-width: 4px; border-top-right-radius: 16px"></span>
<span class="corner" style="left: 0; bottom: 0; border-left-width: 4px; border-bottom-width: 4px; border-bottom-left-radius: 16px"></span>
<span class="corner" style="right: 0; bottom: 0; border-right-width: 4px; border-bottom-width: 4px; border-bottom-right-radius: 16px"></span>
</div>

<sc-if value="{{asking}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 8px; right: 8px; bottom: 30px; padding: 18px 16px 16px; border-radius: 28px; background: var(--card); color: var(--dk); display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 12px; align-items: flex-start">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #E2ECE6; color: var(--deep); display: flex; align-items: center; justify-content: center; flex: none"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"></path></svg></span>
<div>
<div style="font-size: 13px; font-weight: 600; color: var(--dk2); text-transform: uppercase; letter-spacing: .3px">Scanned again</div>
<div style="font-size: 22px; font-weight: 700; margin-top: 2px">Water jug, 7 gal</div>
<div style="font-size: 15px; color: var(--dk2); margin-top: 2px">You added one a moment ago.</div>
</div>
</div>
<button onClick="{{addAnother}}" style="min-height: 56px; border-radius: 16px; border: none; background: var(--deep); color: #FFFDF9; font-size: 17px; font-weight: 600">Add another · makes {{next}} jugs</button>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button onClick="{{skip}}" style="min-height: 52px; border-radius: 16px; border: none; background: var(--track); color: var(--dk); font-size: 15px; font-weight: 600">Oops, double scan</button>
<a href="Picker-Date.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 16px; background: var(--track); color: var(--dk); font-size: 15px; font-weight: 600">Different date</a>
</div>
</div>
</sc-if>

<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 16px; right: 16px; bottom: 60px; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; border-radius: 16px; background: rgba(40,34,27,.9); font-size: 17px">
<svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="color: var(--tint)"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span style="flex: 1">{{toast}}</span>
<button onClick="{{reset}}" style="min-height: 44px; border: none; background: transparent; color: var(--tint); font-weight: 600">Replay</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { mode: 'ask', count: 8, jugs: 1 }; }
renderVals() {
const s = this.state;
return {
asking: s.mode === 'ask', done: s.mode !== 'ask',
count: s.count, next: s.jugs + 1,
toast: s.mode === 'added' ? 'Water jugs now ' + s.jugs + ' × 7 gal' : 'Ignored. Ready for the next item.',
addAnother: () => this.setState({ mode: 'added', jugs: s.jugs + 1, count: s.count + 1 }),
skip: () => this.setState({ mode: 'skipped' }),
reset: () => this.setState({ mode: 'ask', count: 8, jugs: 1 })
};
}
}
</script>
</body>
</html>
