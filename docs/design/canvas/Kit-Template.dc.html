<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit kit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.hs{--bg:#F6F1E9;--card:#FFFDF9;--ink:#2B241E;--ink2:#5F554B;--ink3:#776C61;--sep:#E6DED2;--tint:#2F5D50;--red:#A3241B;--track:#E2D9CB;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.cap{display:flex;justify-content:space-between;margin:0 16px 6px;font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.2px;font-weight:400}
.foot{margin:6px 16px 0;font-size:13px;color:var(--ink2);line-height:1.35}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 16px;box-sizing:border-box;font-size:17px}
.row+.row{border-top:0.5px solid var(--sep)}
.val{margin-left:auto;color:var(--ink2);display:flex;align-items:center;gap:4px}
.del{width:28px;height:28px;border:none;border-radius:14px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.sw{width:51px;height:31px;border-radius:16px;border:none;padding:2px;display:flex;flex:none}
.sw span{width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
</style>
</helmet>
<div class="hs" style="width: 390px; height: 1100px; position: relative; overflow: hidden">
<header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 50px 8px 6px">
<a href="Kit-Detail.dc.html" style="justify-self: start; min-height: 44px; display: flex; align-items: center; padding: 0 8px; font-size: 17px; color: var(--tint)">Cancel</a>
<h1 style="margin: 0; font-size: 17px; font-weight: 600">Edit kit</h1>
<a href="Kit-Detail.dc.html" style="justify-self: end; min-height: 44px; display: flex; align-items: center; padding: 0 8px; font-size: 17px; font-weight: 600; color: var(--tint)">Done</a>
</header>

<div style="padding: 6px 16px 0; display: flex; flex-direction: column; gap: 20px">
<div class="group">
<label class="row"><span style="width: 90px">Name</span><input value="Go-bag (Hampton)" aria-label="Kit name" style="flex: 1; border: none; background: transparent; font: inherit; color: var(--ink); outline: none"></label>
<div class="row"><span>Location</span><span class="val">Hall closet<svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M8 10l4-4 4 4M8 14l4 4 4-4"></path></svg></span></div>
<div class="row"><span>Check every</span><span class="val">6 months<svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M8 10l4-4 4 4M8 14l4 4 4-4"></path></svg></span></div>
<div class="row"><span style="flex: 1">Count toward home runway</span><button class="sw" role="switch" aria-checked="{{counts}}" aria-label="Count toward home runway" onClick="{{toggle}}" style="{{swStyle}}"><span></span></button></div>
</div>

<section>
<h2 class="cap"><span>Requirements · 72-hour go-bag</span><span>{{count}}</span></h2>
<div class="group">
<sc-for list="{{reqs}}" as="r" hint-placeholder-count="14">
<div class="row">
<button class="del" aria-label="Remove requirement" onClick="{{r.remove}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="stroke-width: 2.6"><path d="M7 12h10"></path></svg></button>
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="color: var(--ink2); font-size: 15px">{{r.qty}}</span>
<svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="color: var(--ink3)"><path d="M5 9h14M5 15h14"></path></svg>
</div>
</sc-for>
<a class="row" href="#" style="color: var(--tint)"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>Add requirement</a>
</div>
<p class="foot">Quantities are per person. The template came from "72-hour go-bag"; your edits apply to this kit only.</p>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
constructor(p) {
super(p);
this.state = { counts: false, removed: [] };
}
renderVals() {
const all = [
['Water', '3 L'], ['Food', '3 days'], ['Water filter', '1'], ['Headlamp', '1'],
['AAA batteries', '8'], ['First-aid pouch', '1'], ['Emergency blankets', '2'], ['Rain shell', '1'],
['Fire starter', '1'], ['Multi-tool', '1'], ['Battery bank', '1'], ['N95 masks', '2'],
['Document copies', '1 set'], ['Socks', '2 pair']
];
const reqs = all.filter(([n]) => this.state.removed.indexOf(n) < 0).map(([name, qty]) => ({
name, qty,
remove: () => this.setState({ removed: this.state.removed.concat([name]) })
}));
const on = this.state.counts;
return {
reqs,
count: reqs.length + ' items',
counts: on ? 'true' : 'false',
swStyle: on ? 'background: #2F5D50; justify-content: flex-end' : 'background: #E2D9CB; justify-content: flex-start',
toggle: () => this.setState({ counts: !on })
};
}
}
</script>
</body>
</html>
