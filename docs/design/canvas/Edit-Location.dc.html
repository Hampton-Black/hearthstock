<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit location</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.hs{--bg:#F6F1E9;--card:#FFFDF9;--ink:#2B241E;--ink2:#5F554B;--ink3:#776C61;--sep:#E6DED2;--tint:#2F5D50;--amber:#8A5A00;--red:#A3241B;--track:#E9E2D6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.cap{margin:0 16px 6px;font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.2px;font-weight:400}
.foot{margin:6px 16px 0;font-size:13px;color:var(--ink2);line-height:1.35}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;box-sizing:border-box;font-size:17px;width:100%;border:none;background:transparent;text-align:left}
.row+.row{border-top:0.5px solid var(--sep)}
</style>
</helmet>
<div class="hs" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2A241D">
<div style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; background: var(--bg); border-radius: 12px 12px 0 0; display: flex; flex-direction: column">
<div style="display: flex; justify-content: center; padding-top: 6px"><span style="width: 36px; height: 5px; border-radius: 3px; background: var(--sep)"></span></div>
<header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 4px 8px 8px">
<a href="Settings.dc.html" style="justify-self: start; min-height: 44px; display: flex; align-items: center; padding: 0 8px; font-size: 17px; color: var(--tint)">Cancel</a>
<h1 style="margin: 0; font-size: 17px; font-weight: 600">Edit location</h1>
<a href="Settings.dc.html" style="justify-self: end; min-height: 44px; display: flex; align-items: center; padding: 0 8px; font-size: 17px; font-weight: 600; color: var(--tint)">Done</a>
</header>

<div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 22px">
<div class="group">
<label class="row"><span style="width: 70px">Name</span><input value="Garage shelf" aria-label="Location name" style="flex: 1; border: none; background: transparent; font: inherit; color: var(--ink); outline: none"></label>
</div>

<section>
<h2 class="cap">Storage climate</h2>
<div class="group" role="radiogroup" aria-label="Storage climate">
<sc-for list="{{climates}}" as="c" hint-placeholder-count="4">
<button class="row" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="min-height: 64px">
<span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 600">{{c.name}}</span><span style="display: block; font-size: 15px; color: var(--ink2)">{{c.desc}}</span></span>
<sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="color: var(--tint); stroke-width: 2.4"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
</button>
</sc-for>
</div>
<p class="foot">5 lots are stored here. Changing the climate updates how long they stay good past their printed dates.</p>
</section>

<div class="group">
<a class="row" href="Settings.dc.html" style="justify-content: center; color: var(--red)">Delete location</a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { pick: 'hot' }; }
renderVals() {
const list = [
{ id: 'cool', name: 'Cool & dry', desc: 'Pantry, closet, basement · full shelf life' },
{ id: 'room', name: 'Room temperature', desc: 'Kitchen cabinets, living areas' },
{ id: 'hot', name: 'Hot garage', desc: 'Summer heat · shortens shelf life' },
{ id: 'car', name: 'Vehicle', desc: 'Big temperature swings · shortest shelf life' }
];
const climates = list.map((c) => ({
name: c.name, desc: c.desc,
on: this.state.pick === c.id,
pick: () => this.setState({ pick: c.id })
}));
return { climates };
}
}
</script>
</body>
</html>
