<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slice 3 product picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.hs{--bg:#F6F1E9;--card:#FFFDF9;--ink:#2B241E;--ink2:#5F554B;--ink3:#776C61;--sep:#E6DED2;--tint:#2F5D50;--tintSoft:#E2ECE6;--track:#E9E2D6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.cap{margin:0 16px 6px;font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.2px;font-weight:400}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;box-sizing:border-box;font-size:17px}
.row+.row{border-top:0.5px solid var(--sep)}
.cat{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--track);color:var(--ink2)}
</style>
</helmet>
<div class="hs" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2A241D">
<div style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; background: var(--bg); border-radius: 12px 12px 0 0; display: flex; flex-direction: column">
<div style="display: flex; justify-content: center; padding-top: 6px"><span style="width: 36px; height: 5px; border-radius: 3px; background: var(--sep)"></span></div>
<header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 4px 8px 6px">
<a href="S3-AddLot.dc.html" style="justify-self: start; min-height: 44px; display: flex; align-items: center; padding: 0 8px; font-size: 17px; color: var(--tint)">Cancel</a>
<h1 style="margin: 0; font-size: 17px; font-weight: 600">Choose product</h1>
<span></span>
</header>
<div style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 11px; background: var(--track); color: var(--ink2)">
<svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
<input type="search" placeholder="Search products" aria-label="Search products" value="{{q}}" onInput="{{onQ}}" style="flex: 1; min-width: 0; border: none; background: transparent; font: inherit; font-size: 17px; color: var(--ink); outline: none">
</label>

<div class="group">
<a class="row" href="S3-ProductForm.dc.html" style="color: var(--tint); font-weight: 600"><span class="cat" style="background: var(--tintSoft); color: var(--tint)"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>{{newLabel}}</a>
</div>

<section>
<h2 class="cap">{{heading}}</h2>
<div class="group">
<sc-for list="{{items}}" as="p" hint-placeholder-count="6">
<a class="row" href="S3-AddLot.dc.html"><span class="cat"><sc-if value="{{p.water}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path></svg></sc-if><sc-if value="{{p.food}}" hint-placeholder-val="{{ true }}"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2 6 0 8v10"></path></svg></sc-if></span><span style="flex: 1; min-width: 0"><span style="display: block">{{p.name}}</span><span style="display: block; font-size: 13px; color: var(--ink2)">{{p.sub}}</span></span></a>
</sc-for>
</div>
<sc-if value="{{none}}" hint-placeholder-val="{{ false }}"><p style="margin: 10px 16px 0; font-size: 15px; color: var(--ink2)">No products match. Create it with the button above.</p></sc-if>
</section>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { q: '' }; }
renderVals() {
const all = [
['Bottled water, 0.5 L', 'Water · used 2 days ago', 'W'], ['Black beans, 15 oz', 'Food · used last week', 'F'],
['White rice', 'Food · per lb', 'F'], ['Water jug, 7 gal', 'Water · per gal', 'W'],
['Peanut butter, 40 oz', 'Food · per jar', 'F'], ['Honey', 'Food · per lb', 'F'],
['Pinto beans, Mylar bucket', 'Food · per lb', 'F'], ['MRE', 'Food · per meal', 'F']
];
const q = this.state.q.trim().toLowerCase();
const hits = all.filter(([n]) => !q || n.toLowerCase().indexOf(q) >= 0);
const items = (q ? hits : hits.slice(0, 6)).map(([name, sub, icon]) => ({ name, sub, water: icon === 'W', food: icon === 'F' }));
return {
q: this.state.q,
onQ: (e) => this.setState({ q: e.target.value }),
heading: q ? 'Matches' : 'Recent',
items, none: items.length === 0,
newLabel: q ? 'New product “' + this.state.q.trim() + '”' : 'New product'
};
}
}
</script>
</body>
</html>
