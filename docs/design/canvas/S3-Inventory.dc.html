<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slice 3 inventory</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.hs{--bg:#F6F1E9;--card:#FFFDF9;--ink:#2B241E;--ink2:#5F554B;--ink3:#776C61;--sep:#E6DED2;--tint:#2F5D50;--tintSoft:#E2ECE6;--good:#2E6B4F;--goodBg:#E1EEE5;--amber:#8A5A00;--amberBg:#FBEACB;--track:#E9E2D6;--bar:rgba(255,253,249,.92);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.group{background:var(--card);border-radius:16px;overflow:hidden}
.cap{display:flex;justify-content:space-between;margin:0 16px 6px;font-size:15px;font-weight:600;color:var(--ink2)}
.rowwrap{position:relative;overflow:hidden}
.rowwrap+.rowwrap{border-top:0.5px solid var(--sep)}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 16px;box-sizing:border-box;background:var(--card);position:relative;width:100%;border:none;text-align:left;transition:transform .2s}
.acts{position:absolute;right:0;top:0;bottom:0;display:flex}
.act{width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;color:#FFFDF9}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;flex:none}
.flag{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:18px;border:none;font-size:15px;font-weight:600;background:var(--card)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--track);border-radius:9px;padding:2px}
.seg span{display:flex;align-items:center;justify-content:center;min-height:34px;border-radius:7px;font-size:15px;font-weight:500}
.seg span.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:83px;background:var(--bar);border-top:0.5px solid var(--sep);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding-top:7px;box-sizing:border-box;z-index:2}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--ink3)}
.tab.on{color:var(--tint)}
</style>
</helmet>
<div class="hs" style="width: 390px; height: 844px; position: relative; overflow: hidden">
<div style="padding: 54px 16px 100px; display: flex; flex-direction: column; gap: 10px">
<header style="display: flex; align-items: flex-end; justify-content: space-between; padding: 6px 4px 0">
<h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.4px">Inventory</h1>
<a href="S3-AddLot.dc.html" aria-label="Add item" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--tint)"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
</header>
<label style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 11px; background: var(--track); color: var(--ink2)">
<svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
<input type="search" placeholder="Search names and notes" aria-label="Search inventory" style="flex: 1; min-width: 0; border: none; background: transparent; font: inherit; font-size: 17px; color: var(--ink); outline: none">
</label>
<div class="seg" role="group" aria-label="Group by"><span class="on">By location</span><span>By category</span></div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span class="chip" style="background: var(--tint); color: #FFFDF9"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path></svg>Water<a href="#" aria-label="Clear Water filter" style="display: flex; margin-right: -4px"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="stroke-width: 2.2"><path d="M7 7l10 10M17 7L7 17"></path></svg></a></span>
<button class="chip"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="color: var(--amber)"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>Expiring soon</button>
</div>

<section style="margin-top: 4px">
<h2 class="cap"><span>Garage shelf</span><span class="num" style="font-weight: 400">4 lots</span></h2>
<div class="group">
<div class="rowwrap">
<div class="acts"><a class="act" href="S3-UseSheet.dc.html" style="background: var(--tint)"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M8 12h8"></path></svg>Use</a><a class="act" href="S3-UseSheet.dc.html" style="background: #7A6A55"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Adjust</a></div>
<button class="row" onClick="{{toggle}}" style="{{swipeStyle}}">
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 17px; font-weight: 600">Stored tap water</span><span style="display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--ink2)"><span class="num" style="font-weight: 600; color: var(--ink)">5 gal</span><span class="flag"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"></rect><path d="M4 10h16M12 13v3M12 18.5v.01"></path></svg>No date</span></span></span>
<span class="badge" style="color: var(--amber); box-shadow: inset 0 0 0 1.5px var(--amber)"><svg class="ic" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" style="stroke-width: 2.2"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>Inspect</span>
</button>
</div>
<div class="rowwrap"><a class="row" href="S3-LotDetail.dc.html"><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 17px; font-weight: 600">Water jugs, 7 gal</span><span class="num" style="display: block; font-size: 15px; color: var(--ink2)"><span style="font-weight: 600; color: var(--ink)">14 gal</span> · filled Jul 2026</span></span><span class="badge" style="color: var(--good); background: var(--goodBg)">Good</span></a></div>
<div class="rowwrap"><a class="row" href="S3-LotDetail.dc.html"><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 17px; font-weight: 600">Bottled water</span><span class="num" style="display: block; font-size: 15px; color: var(--ink2)"><span style="font-weight: 600; color: var(--ink)">3.17 gal</span> · best by Jun 2027</span></span><span class="badge" style="color: var(--good); background: var(--goodBg)">Good</span></a></div>
<div class="rowwrap"><a class="row" href="S3-LotDetail.dc.html"><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 17px; font-weight: 600">Rain barrel</span><span style="display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--ink2)"><span class="num" style="font-weight: 600; color: var(--ink)">50 gal</span><span class="flag"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path><path d="M4 4l16 16"></path></svg>Not potable</span></span></span><span class="badge" style="color: var(--good); background: var(--goodBg)">Good</span></a></div>
</div>
</section>

<section>
<h2 class="cap"><span>Pantry</span><span class="num" style="font-weight: 400">1 lot</span></h2>
<div class="group">
<div class="rowwrap"><a class="row" href="S3-LotDetail.dc.html"><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 17px; font-weight: 600">Drinking water, 1 gal</span><span class="num" style="display: block; font-size: 15px; color: var(--ink2)"><span style="font-weight: 600; color: var(--ink)">1 gal</span> · best by Feb 2028</span></span><span class="badge" style="color: var(--good); background: var(--goodBg)">Good</span></a></div>
</div>
</section>
</div>

<nav class="tabbar" aria-label="Tabs">
<a class="tab" href="S3-Dashboard.dc.html"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M3.5 16a8.5 8.5 0 0 1 17 0"></path><path d="M12 16l4.5-5"></path><path d="M3 20h18"></path></svg><span>Runway</span></a>
<a class="tab on" href="S3-Inventory.dc.html"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"></path><path d="M3 7.5l9 4.5 9-4.5M12 12v9"></path></svg><span>Inventory</span></a>
<a class="tab" href="S3-Settings.dc.html"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg><span>Settings</span></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { open: true }; }
renderVals() {
return {
swipeStyle: this.state.open ? 'transform: translateX(-168px)' : 'transform: none',
toggle: () => this.setState({ open: !this.state.open })
};
}
}
</script>
</body>
</html>
