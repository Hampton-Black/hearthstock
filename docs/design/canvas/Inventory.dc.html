<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inventory</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.hs{--bg:#F6F1E9;--card:#FFFDF9;--ink:#2B241E;--ink2:#5F554B;--ink3:#776C61;--sep:#E6DED2;--tint:#2F5D50;--tintSoft:#E2ECE6;--good:#2E6B4F;--goodBg:#E1EEE5;--amber:#8A5A00;--amberBg:#FBEACB;--red:#A3241B;--redBg:#F7DFDB;--track:#E9E2D6;--bar:rgba(255,253,249,.92);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.hs.dark{--bg:#17140F;--card:#25211B;--ink:#F3ECE2;--ink2:#BCB09F;--ink3:#A39784;--sep:#3A342C;--tint:#86BBA6;--tintSoft:#24352E;--good:#8CC7A5;--goodBg:#203328;--amber:#F0BC5E;--amberBg:#3A2E17;--red:#F2918A;--redBg:#41201C;--track:#2E2923;--bar:rgba(30,27,22,.94)}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.group{background:var(--card);border-radius:16px;overflow:hidden}
.cap{display:flex;justify-content:space-between;margin:0 16px 6px;font-size:15px;font-weight:600;color:var(--ink2)}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 16px;box-sizing:border-box}
.row+.row{border-top:0.5px solid var(--sep)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;flex:none}
.b-good{color:var(--good);background:var(--goodBg)}
.b-soon{color:var(--ink);background:var(--track)}
.b-soon svg{color:var(--amber)}
.b-caution{color:var(--amber);background:var(--amberBg)}
.b-inspect{color:var(--amber);box-shadow:inset 0 0 0 1.5px var(--amber)}
.b-expired{color:var(--red);background:var(--redBg)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--track);border-radius:9px;padding:2px}
.seg button{border:none;background:transparent;min-height:34px;border-radius:7px;font-size:15px;font-weight:500}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:18px;border:none;font-size:15px;font-weight:600;background:var(--card);color:var(--ink)}
.chip.on{background:var(--amberBg);color:var(--amber)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:83px;background:var(--bar);border-top:0.5px solid var(--sep);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-top:7px;box-sizing:border-box;z-index:2}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--ink3)}
.tab.on{color:var(--tint)}
.fab{position:absolute;right:16px;bottom:99px;z-index:2;display:flex;align-items:center;gap:8px;height:56px;padding:0 22px;border-radius:28px;background:var(--tint);color:var(--card);font-size:17px;font-weight:600;box-shadow:0 6px 18px rgba(30,40,30,.25)}
</style>
</helmet>
<div class="{{rootClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden">
<div style="padding: 54px 16px 100px; display: flex; flex-direction: column; gap: 12px">
<header style="display: flex; align-items: flex-end; justify-content: space-between; padding: 6px 4px 0">
<h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.4px">Inventory</h1>
<a href="Add-Form.dc.html" aria-label="Add item manually" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--tint)"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
</header>
<label style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 11px; background: var(--track); color: var(--ink2)">
<svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
<input type="search" placeholder="Search 34 items" aria-label="Search inventory" style="flex: 1; border: none; background: transparent; font: inherit; font-size: 17px; color: var(--ink); outline: none">
</label>
<div class="seg" role="group" aria-label="Group by">
<button class="{{locClass}}" onClick="{{byLocation}}">By location</button>
<button class="{{catClass}}" onClick="{{byCategory}}">By category</button>
</div>
<div style="display: flex; gap: 8px">
<button class="{{chipClass}}" onClick="{{toggleSoon}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>Expiring soon · 3</button>
</div>

<sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
<section style="margin-top: 6px">
<h2 class="cap"><span>{{sec.title}}</span><span style="font-weight: 400">{{sec.sub}}</span></h2>
<div class="group">
<sc-for list="{{sec.items}}" as="it" hint-placeholder-count="3">
<a class="row" href="Item-Detail.dc.html">
<span style="flex: 1; min-width: 0">
<span style="display: block; font-size: 17px; font-weight: 600">{{it.name}}</span>
<span style="display: block; font-size: 15px; color: var(--ink2)"><span class="num" style="font-weight: 600; color: var(--ink)">{{it.qty}}</span> · {{it.note}}</span>
</span>
<span class="{{it.cls}}"><sc-if value="{{it.isSoon}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="stroke-width: 2.2"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></sc-if><sc-if value="{{it.isCaution}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="stroke-width: 2.2"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"></path></svg></sc-if><sc-if value="{{it.isInspect}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="stroke-width: 2.2"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg></sc-if><sc-if value="{{it.isExpired}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="stroke-width: 2.2"><path d="M7 7l10 10M17 7L7 17"></path></svg></sc-if>{{it.label}}</span>
</a>
</sc-for>
</div>
</section>
</sc-for>
</div>

<a class="fab" href="Add-Scan.dc.html"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 9v6M11 9v6M14 9v6M16.5 9v6"></path></svg>Scan</a>

<nav class="tabbar" aria-label="Tabs">
<a class="tab" href="Main.dc.html"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M3.5 16a8.5 8.5 0 0 1 17 0"></path><path d="M12 16l4.5-5"></path><path d="M3 20h18"></path></svg><span>Runway</span></a>
<a class="tab on" href="Inventory.dc.html"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"></path><path d="M3 7.5l9 4.5 9-4.5M12 12v9"></path></svg><span>Inventory</span></a>
<a class="tab" href="Kits.dc.html"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="5" y="7" width="14" height="14" rx="3.5"></rect><path d="M9 7V5.5a3 3 0 0 1 6 0V7M9 13h6"></path></svg><span>Kits</span></a>
<a class="tab" href="Settings.dc.html"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg><span>Settings</span></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { by: 'loc', soon: false }; }
renderVals() {
const S = {
good: ['Good', 'badge b-good'], soon: ['Use soon', 'badge b-soon'], caution: ['Caution', 'badge b-caution'],
inspect: ['Inspect', 'badge b-inspect'], expired: ['Expired', 'badge b-expired']
};
const items = [
{ name: 'Black beans, 15 oz', qty: '6 cans', loc: 'Pantry', cat: 'Food', note: 'Best by Mar 2026', st: 'caution', soon: true },
{ name: 'Peanut butter, 40 oz', qty: '2 jars', loc: 'Pantry', cat: 'Food', note: 'Best by Aug 2027', st: 'good' },
{ name: 'Honey', qty: '3 lb', loc: 'Pantry', cat: 'Food', note: 'No date', st: 'good' },
{ name: 'Drinking water, 1 gal', qty: '1 jug', loc: 'Pantry', cat: 'Water', note: 'Best by Feb 2028', st: 'good' },
{ name: 'White rice', qty: '20 lb', loc: 'Garage shelf', cat: 'Food', note: 'Best by Jan 2029', st: 'good' },
{ name: 'Pinto beans, Mylar bucket', qty: '25 lb', loc: 'Garage shelf', cat: 'Food', note: 'Packed 2025', st: 'good' },
{ name: 'Bottled water', qty: '24 × 0.5 L', loc: 'Garage shelf', cat: 'Water', note: 'Best by Jun 2027', st: 'good' },
{ name: 'Water jugs', qty: '2 × 7 gal', loc: 'Garage shelf', cat: 'Water', note: 'Filled Jul 2026', st: 'good' },
{ name: 'Stored tap water', qty: '5 gal', loc: 'Garage shelf', cat: 'Water', note: 'Filled Apr 2026 · check seal', st: 'inspect', soon: true },
{ name: 'Bottled water, 1 L', qty: '3 × 1 L', loc: 'Hall closet', cat: 'Water', note: 'Go-bag (Hampton) · exp Oct 27', st: 'soon', soon: true },
{ name: 'MRE', qty: '1 meal', loc: 'Hall closet', cat: 'Food', note: 'Go-bag (Hampton)', st: 'good' }
];
const key = this.state.by === 'loc' ? 'loc' : 'cat';
const order = key === 'loc' ? ['Pantry', 'Garage shelf', 'Hall closet'] : ['Water', 'Food'];
const shown = items.filter((i) => !this.state.soon || i.soon);
const sections = order.map((t) => {
const its = shown.filter((i) => i[key] === t).map((i) => ({
name: i.name, qty: i.qty,
note: key === 'loc' ? i.note : i.loc + ' · ' + i.note,
label: S[i.st][0], cls: S[i.st][1],
isSoon: i.st === 'soon', isCaution: i.st === 'caution', isInspect: i.st === 'inspect', isExpired: i.st === 'expired'
}));
return { title: t, sub: its.length + (its.length === 1 ? ' lot' : ' lots'), items: its };
}).filter((s) => s.items.length);
return {
rootClass: (this.props.dark ?? false) ? 'hs dark' : 'hs',
sections,
locClass: this.state.by === 'loc' ? 'on' : '',
catClass: this.state.by === 'cat' ? 'on' : '',
chipClass: this.state.soon ? 'chip on' : 'chip',
byLocation: () => this.setState({ by: 'loc' }),
byCategory: () => this.setState({ by: 'cat' }),
toggleSoon: () => this.setState({ soon: !this.state.soon })
};
}
}
</script>
</body>
</html>
