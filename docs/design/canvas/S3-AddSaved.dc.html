<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slice 3 lot saved</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.hs{--bg:#F6F1E9;--card:#FFFDF9;--ink:#2B241E;--ink2:#5F554B;--ink3:#776C61;--sep:#E6DED2;--tint:#2F5D50;--tintSoft:#E2ECE6;--track:#E9E2D6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div class="hs" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2A241D">
<div style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; background: var(--bg); border-radius: 12px 12px 0 0; display: flex; flex-direction: column; padding: 0 16px 38px; box-sizing: border-box">
<div style="display: flex; justify-content: center; padding-top: 6px"><span style="width: 36px; height: 5px; border-radius: 3px; background: var(--sep)"></span></div>
<div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding-top: 40px">
<span style="width: 64px; height: 64px; border-radius: 32px; background: var(--tint); color: #FFFDF9; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" width="34" height="34" aria-hidden="true" style="stroke-width: 2.4"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<h1 style="margin: 8px 0 0; font-size: 26px; font-weight: 700">Saved to {{place}}</h1>
</div>

<section style="margin-top: 24px; background: var(--card); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: flex-start; gap: 12px">
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 20px; font-weight: 700">{{name}}</span><span class="num" style="display: block; font-size: 15px; color: var(--ink2); margin-top: 2px">{{qty}}</span></span>
<span style="{{badgeStyle}}">{{state}}</span>
</div>
<p style="margin: 0; font-size: 15px; color: var(--ink2); line-height: 1.4">{{why}}</p>
<div class="num" style="display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; border-top: 0.5px solid var(--sep); font-size: 15px"><span style="color: var(--ink2)">Runway</span><strong style="text-align: right">{{effect}}</strong></div>
</section>

<a href="S3-LotDetail.dc.html" style="align-self: center; margin-top: 12px; min-height: 44px; display: flex; align-items: center; font-size: 17px; color: var(--tint)">View lot</a>

<div style="flex: 1"></div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<a href="S3-AddLot.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; background: var(--tintSoft); color: var(--tint); font-size: 17px; font-weight: 600">Add another</a>
<a href="S3-Inventory.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; background: var(--tint); color: #FFFDF9; font-size: 17px; font-weight: 600">Done</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;example&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Old beans&quot;,&quot;Rice&quot;,&quot;Expired soup&quot;],&quot;default&quot;:&quot;Old beans&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() {
const base = 'display: inline-flex; align-items: center; font-size: 15px; font-weight: 600; padding: 4px 12px; border-radius: 999px; white-space: nowrap; flex: none; ';
const ex = {
'Old beans': { place: 'Pantry', name: 'Black beans, 15 oz', qty: '6 cans · best by Aug 2025', state: 'Caution', badgeStyle: base + 'color: #8A5A00; background: #FBEACB',
why: 'Printed 14 months ago and past best-by, but canned goods in a cool pantry stay usable until Feb 2028. Eat these first.', effect: '+2,310 kcal, high end only' },
'Rice': { place: 'Garage shelf', name: 'White rice', qty: '20 lb · best by Mar 2025', state: 'Expired', badgeStyle: base + 'color: #A3241B; background: #F7DFDB',
why: 'White rice gets 24 months past best-by, but the hot garage halves that to 12, so it ran out in Mar 2026. In Mylar or a cooler spot it would still count.', effect: 'Not counted' },
'Expired soup': { place: 'Pantry', name: 'Tomato soup', qty: '3 cans · best by Jan 2023', state: 'Expired', badgeStyle: base + 'color: #A3241B; background: #F7DFDB',
why: 'Past the end of its usable window. It’s saved so you remember to toss it; delete it if this was a typo.', effect: 'Not counted' }
};
return ex[this.props.example ?? 'Old beans'];
}
}
</script>
</body>
</html>
